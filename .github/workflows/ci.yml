name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:core && npm run build:db && npm run build:providers && npm run build:server
      - run: npm test
      - run: npm run smoke:full
      - run: npm audit --audit-level=high
        continue-on-error: true
