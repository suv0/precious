services:
  precious:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - precious-data:/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/data
      - DATABASE_PATH=/data/precious.db
      - WEB_DIST=/app/apps/web/out
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  precious-data:
